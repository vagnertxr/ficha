name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest tests/test_unit.py
      - name: Wheel e código-fonte
        run: |
          python -m pip install build
          python -m build
      - name: ficha.pyz (arquivo único)
        run: |
          python packaging/build_pyz.py
          python dist/ficha.pyz --lang en games
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        env:
          # O setup.py do vgamepad abre o instalador do driver ViGEmBus e espera um clique;
          # no CI não tem ninguém pra clicar. Quem usa o ficha instala o driver à parte.
          VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
        run: python -m pip install pyinstaller pysdl2 pysdl2-dll vgamepad
      - name: ficha.exe (PyInstaller)
        run: >
          pyinstaller --onefile --console --name ficha --paths .
          --add-data "ficha/games;ficha/games"
          --add-data "ficha/locales;ficha/locales"
          --add-data "ficha/ui;ficha/ui"
          --hidden-import ficha.platform.windows
          --hidden-import ficha.platform.windows_maps
          --hidden-import sdl2 --hidden-import sdl2dll --hidden-import vgamepad
          --collect-binaries sdl2dll --collect-data sdl2dll
          --collect-binaries vgamepad --collect-data vgamepad
          packaging/ficha_entry.py
      - name: O executável responde
        run: dist\ficha.exe --lang en games
      - name: Renomeia
        run: Move-Item dist\ficha.exe dist\ficha-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ficha-windows-x64.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "ficha $GITHUB_REF_NAME"
          --notes-file packaging/release-notes.md
          artifacts/linux/* artifacts/windows/*
