name: testes

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes unitários (sem dispositivos)
        run: python -m unittest tests/test_unit.py -v
      - name: Pacote instala e o comando responde
        run: |
          python -m pip install .
          ficha --lang en games
